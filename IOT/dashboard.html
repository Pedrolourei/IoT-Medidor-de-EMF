<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard SDAP (com API Python)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #282c34; color: #abb2bf; display: flex; flex-direction: column; align-items: center; }
        .container { width: 90%; max-width: 800px; }
        h1 { color: #61afef; text-align: center; }
        .widget { background-color: #323842; border-radius: 8px; padding: 15px 25px; margin-bottom: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        h2 { margin-top: 0; border-bottom: 2px solid #61afef; padding-bottom: 10px; }
        .data { font-size: 2.5em; font-weight: bold; color: #98c379; }
        #estado-valor.alerta { color: #e06c75; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dashboard - Sistema de Detecção de Anomalias Paranormais</h1>

        <div class="widget">
            <h2>🌡️ Temperatura</h2>
            <p><span id="temp-valor" class="data">--</span> °C</p>
        </div>

        <div class="widget">
            <h2>🔊 Nível de Ruído</h2>
            <p><span id="ruido-valor" class="data">--</span> (raw)</p>
        </div>

        <div class="widget">
            <h2>👻 Atividade Paranormal</h2>
            <p>Nível: <span id="atividade-valor" class="data">--</span>/5</p>
            <p>Estado: <span id="estado-valor" class="data">Normal</span></p>
        </div>
    </div>

    <script>
        // URL base da nossa API Python que está rodando localmente
        const API_URL = 'http://localhost:5000/dados';

        // Função para buscar e atualizar todos os dados do dashboard
        async function atualizarDashboard() {
            try {
                // Busca os dados de temperatura
                const responseTemp = await fetch(`${API_URL}/temperatura`);
                const dataTemp = await responseTemp.json();
                document.getElementById('temp-valor').innerText = dataTemp.valor.toFixed(2);

                // Busca os dados de som
                const responseSom = await fetch(`${API_URL}/som`);
                const dataSom = await responseSom.json();
                document.getElementById('ruido-valor').innerText = dataSom.valor_raw;

                // Busca os dados de status
                const responseStatus = await fetch(`${API_URL}/status`);
                const dataStatus = await responseStatus.json();
                const estadoEl = document.getElementById('estado-valor');
                document.getElementById('atividade-valor').innerText = dataStatus.atividade_paranormal;
                estadoEl.innerText = dataStatus.estado;
                
                // Muda a cor do texto de estado se for um alerta
                if (dataStatus.estado === 'ALERTA') {
                    estadoEl.classList.add('alerta');
                } else {
                    estadoEl.classList.remove('alerta');
                }

            } catch (error) {
                console.error("Erro ao buscar dados da API:", error);
            }
        }

        // Chama a função pela primeira vez para carregar os dados iniciais
        atualizarDashboard();

        // Configura para chamar a função e atualizar os dados a cada 3 segundos
        setInterval(atualizarDashboard, 3000);
    </script>
</body>
</html>
